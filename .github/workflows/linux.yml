# Compila Cordis para Linux (.AppImage y .deb) y pasa los tests.
#
# Se lanza a mano (pestaña Actions → «Linux» → «Run workflow») o al subir una
# etiqueta de versión (`git tag v0.1.0 && git push origin v0.1.0`).
# Los paquetes quedan como artefactos de la ejecución (se guardan 30 días).

name: Linux

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # 22.04 y no la última: el .AppImage enlaza con la glibc del sistema donde
    # se compila, así que cuanto más antigua, en más distribuciones funciona.
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Dependencias del sistema (prerrequisitos de Tauri 2)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential file patchelf \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Instalar dependencias de npm
        run: npm ci

      - name: Comprobar tipos (svelte-check)
        run: npm run check

      - name: Tests de Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Compilar .AppImage y .deb
        run: npm run tauri build -- --bundles appimage,deb

      - name: Subir los paquetes
        uses: actions/upload-artifact@v4
        with:
          name: cordis-linux
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 30
